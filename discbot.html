<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Discord Bot</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
```

</head>

<body>
    <main>
        <input type="text" id="password" placeholder="Enter password">

```
    <button onclick="submitPassword()">Submit</button>
</main>

<script>
    function submitPassword() {
        const password = document.getElementById("password").value;
        const required = String.fromCharCode(
            80, 111, 115, 116, 101, 114, 105, 115, 97, 116, 105, 111, 110
        );

        if (password === required) {
            window.location.href = "https://discord.com/oauth2/authorize?client_id=1544902161056403506&permissions=8&integration_type=0&scope=bot";
        }
    }
</script>
```

</body>
</html>
